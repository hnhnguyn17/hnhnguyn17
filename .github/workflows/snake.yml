name: Generate Snake Animation

on:
  # Tự động chạy cập nhật mỗi 24 giờ (lúc 0h UTC)
  schedule:
    - cron: "0 0 * * *"
  
  # Cho phép bấm chạy thủ công ngay lập tức trong tab Actions
  workflow_dispatch:
  
  # Tự động chạy khi bạn push thay đổi lên nhánh main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. Tạo file SVG hình con rắn từ biểu đồ commit của hnhnguyn17
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Đẩy file hình con rắn sang một nhánh riêng tên là "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
